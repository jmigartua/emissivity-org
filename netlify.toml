# Netlify configuration — emissivity.org
# Continuous deployment: Netlify watches this repo and runs the build on
# every push to the production branch. No base directory — the repo root
# IS the Quarto project.

[build]
  command = "bash tools/netlify-build.sh"
  publish = "_site"

[build.environment]
  # Netlify's Noble build image installs Python via mise, which since
  # Sept 2026 refuses 3.8 (no GitHub artifact attestations). The build only
  # needs python3 + pyyaml, so any current release works.
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Always revalidate assets so CSS/JS/style changes appear immediately after a
# deploy. Netlify serves ETags, so unchanged files still return a fast 304 —
# this keeps the site fresh without re-downloading everything each visit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
