<script>
/* Local-preview shim: when the site is opened from the filesystem
   (file://) rather than a server, rewrite root-absolute links so
   navigation still works. No effect in production. */
(function () {
  if (location.protocol !== "file:") return;
  var marker = "/_site/";
  var i = location.pathname.indexOf(marker);
  if (i < 0) return;
  var root = location.pathname.slice(0, i + marker.length - 1);
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll('a[href^="/"]').forEach(function (a) {
      a.setAttribute("href", "file://" + root + a.getAttribute("href"));
    });
  });
})();
</script>

<script>
/* "New" mark on the News link: shown for 14 days after the newest news item
   (date stamped into #latest-news by tools/generate_changelog.py). It
   pulses for a few seconds, then stays steady; on the news pages it is
   steady from the start. */
(function () {
  var a = document.getElementById('nav-news'), m = document.getElementById('latest-news');
  if (!a || !m) return;
  var d = m.getAttribute('data-date');
  if (!d) return;
  var days = (Date.now() - new Date(d + 'T00:00:00').getTime()) / 864e5;
  if (days < 0 || days > 14) return;
  var dot = a.querySelector('.nav-new');
  if (!dot) return;
  dot.removeAttribute('hidden');
  if (/^\/(news|events-news\/news)\//.test(location.pathname)) dot.classList.add('steady');
})();
</script>
