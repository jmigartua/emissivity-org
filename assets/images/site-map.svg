<title id="sm-title">emissivity.org at a glance</title>
<desc id="sm-desc">Map of the emissivity.org website: the research map of 46 institutions in 14 countries and 3 research networks; the EKHI open database with 1,251 curves; publications, insights and reference guides; the community calendar, schools and news; the IR-EMPOWER workshop archive; and the contribution forms that feed them.</desc>
