# Site changelog — what was added or changed on emissivity.org, for the community.
# Source of truth for /changelog.html ("What's new") and for the "Last updated"
# stamp in the footer. Rendered by tools/generate_changelog.py (run in the build).
#
# One entry per addition. Newest first. Fields:
#   date:    YYYY-MM-DD
#   kind:    content | data | feature | fix | editorial
#   title:   one line, what a visitor would notice
#   summary: one or two sentences (optional)
#   links:   [{label, url}]  (optional, site-relative or external)
#   commit:  short git hash (optional; for maintainers)
#
# Add an entry whenever you add a page, a news item, a dataset, a map entry
# or a feature. Release-level notes for maintainers live in _data/releases.yml.

entries:
- date: 2026-10-01
  kind: editorial
  title: "IETcc-CSIC profile: quantities, angles and spectral ranges typeset as mathematics"
  summary: "First institution profile with typeset symbols; the database now accepts LaTeX in its text fields."
  links:
    - {label: "IETcc-CSIC", url: "/network/csic-ietcc.html"}

- date: 2026-10-01
  kind: feature
  title: "Training section: courses, schools, tutorials and workshops offered by the network"
  summary: "New navbar entry. Lists training items and the existing schools; members can announce courses through the event form."
  links:
    - {label: "Training", url: "/training/index.html"}

- date: 2026-10-01
  kind: feature
  title: "Upcoming events highlighted; a 'new' mark on News for two weeks after each post"
  summary: "Listing items dated today or later get a burgundy box like the home-page announcement band. The News link in the navbar shows a pulsing dot for 14 days after the latest post."

- date: 2026-10-01
  kind: feature
  title: "What's new page, release notes and a 'last updated' stamp in the footer"
  summary: "The site now keeps a public log of additions and a maintainers' release history, both generated from data files at build time."
  links:
    - {label: "What's new", url: "/changelog.html"}
    - {label: "Release notes", url: "/about/release-notes.html"}

- date: 2026-10-01
  kind: content
  title: "RISEnergy 5th transnational access call: free access to CNR-INO's optical laboratory"
  summary: "Call deadline 18 November 2026. The CNR-IMA1 facility page lists spectrometers from 0.18 to 55 µm and an emissivity furnace up to 1200 K."
  links:
    - {label: "News item", url: "/events-news/news/risenergy-access-call-2026.html"}
    - {label: "CNR-INO profile", url: "/network/cnr-ino.html"}
  commit: b9f6111

