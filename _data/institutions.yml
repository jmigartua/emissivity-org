    why_it_matters: |
      CEMHTI is one of the strongest European laboratories in the field because
      it operates precisely in the experimentally difficult regime where
      emissivity cannot be separated from the problem of true temperature
      measurement. Its public instrumentation pages describe infrared/visible
      spectroscopy by reflection, transmission, and emission; the IR-EMPOWER
      program confirms CEMHTI's central role through contributions on
      radiative-property characterization and simultaneous temperature–emittance
      determination. It is a major bridge between fundamental spectroscopy,
      high-temperature materials science, and practical radiative metrology.

    external_sources:
