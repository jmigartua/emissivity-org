    why_it_matters: |
      NTC extends emissivity metrology beyond ideal opaque bulk samples toward
      technologically realistic layered and partially transmitting systems.
      Such systems undermine the simple opaque-body assumptions that underwrite
      much textbook emissivity thinking. A direct radiometric method for
      spectral emissivity of semitransparent coatings has been developed at
      NTC; the institutional page explicitly lists transmittance, reflectance,
      emissivity, absorptivity, and thermal conductivity as measured
      properties.

