    why_it_matters: |
      PROMES represents the branch of emissivity research in which the quantity
      must be determined under high flux, high temperature, and process-relevant
      optical environments. DISCO is explicitly devoted to determining true
      temperature, reflectivity, and emissivity at high temperature; PROMES'
      thermal-radiation-metrology pages emphasize calibration and pyrometric
      methods for real in-situ conditions. In such environments, knowing
      emissivity is the condition for measuring temperature correctly and for
      modeling solar-thermal systems realistically. PROMES is therefore one of
      the clearest global centers for high-temperature thermo-optical
      characterization under real process conditions.

