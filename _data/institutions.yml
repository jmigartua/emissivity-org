      emissometry, but also as a builder of community infrastructure. It
      organized IR-EMPOWER as a workshop devoted specifically to infrared
      emissivity measurement techniques and protocols, and its environment has
      developed EKHI, a structured open database for optical and radiative
      properties (recent Scientific Data publication). Laboratories that both
      measure and curate data help transform a fragmented literature into a
      reusable scientific resource — which makes Thermomat especially relevant
      as a node of community formation, data stewardship, and methodological
      convergence.

