      CAE sits at the interface between precision measurement and energy
      deployment. PTB stands closer to foundational metrology; CAE stands
      closer to the regime where emissivity and reflectance must be measured
      because they determine the behavior of cool materials, high-performance
      envelopes, radiative-cooling systems, and other energy technologies. The
      IR-EMPOWER plenary by Jochen Manara and CAE's role hosting the 2026
      workshop confirm its status as a leading applied-research node linking
      metrology, building materials, and passive radiative cooling.

