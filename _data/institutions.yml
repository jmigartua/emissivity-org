      - "radiation thermometry"
      - "reflectance"
      - "transmittance"

    capabilities:
      temperature_range_text: "−40 °C to ~2300 °C"
      wavelength_range_text: "1 µm to 1 mm (radiometry); near- to far-infrared (emissivity)"
      atmospheres: [air, vacuum]
      methodology_notes: "Accurate and traceable, SI-linked emissivity measurement under air and vacuum; spectral radiance from 1 µm to 1 mm."

    instruments_named: []
    databases_hosted: []

    applications:
      - "non-contact thermometry / radiation thermometry"
      - "Earth and planetary remote sensing"
      - "passive radiative cooling"
      - "energy systems"
      - "radiometric calibration and standards"

    ir_empower_contributions:
      - "Multiple plenary-level contributions on emissivity below and above 1000 K (Adibekyan, Urban, and work on semitransparent samples at PTB facilities)"

    why_it_matters: |
      PTB is one of the very few institutions in the world whose internal
      structure includes a unit explicitly named "Emissivity." That is not a
      semantic detail: it signals that emissivity is not merely an application
      variable, but an institutionalized metrological object requiring
      traceable, uncertainty-controlled, SI-linked measurement. WG 7.35 covers
      accurate and traceable emissivity measurement from near to far infrared
      under air and vacuum, while the adjacent WG 7.32 ties spectral emissivity
      to infrared radiometry and radiation thermometry. PTB is therefore a
      reference institution for pyrometry, remote sensing, radiative cooling,
      and the calibration logic underlying all non-contact temperature
      measurement.

    external_sources:
      - label: "WG 7.35 Emissivity (PTB)"
        url: "https://www.ptb.de/cms/en/ptb/fachabteilungen/abt7/fb-73/ag-735.html"

