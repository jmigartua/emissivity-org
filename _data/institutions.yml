# Emissivity.org — Research Map
# Structured directory of academic and public-sector groups working on
# emissivity, reflectance, transmittance, thermal radiative properties,
# and adjacent infrared / optical characterization.
#
# Scope: non-commercial, research-active entities only.
# Ordering within a tier: by direct centrality to emissivity / radiative-property
# research (not by general prestige).

meta:
  version: "1.0"
  last_updated: "2026-04"
  scope: |
    Non-commercial, research-active entities whose public material explicitly
    mentions emissivity / emittance, reflectance, transmittance, thermal
    emission, radiative cooling, or land-surface emissivity, and that show
    clear evidence of active research programs, dedicated facilities,
    databases, or sustained peer-reviewed output.
  tiers:
    core: "Directly centered on emissivity / thermo-optical metrology"
    extended: "Essential once scope broadens to reflectance, spectral libraries, and radiative-property data infrastructures"
    engineered: "Thermal photonics / radiative cooling / engineered emissivity"
    emerging: "Application-specific, ultrahigh-T frontier, or conference-affiliated"
  ecosystems:
    metrology: "National metrology and infrared radiometry"
    high_temperature: "High-temperature thermo-optical characterization"
    cryogenic: "Cryogenic radiative properties"
    remote_sensing: "Earth and planetary remote-sensing emissivity"
    spectral_libraries: "Spectral libraries and reflectance/emission databases"
    thermophysical_databases: "Curated thermophysical-property data infrastructures"
    engineered_emissivity: "Thermal photonics, metasurfaces, radiative cooling"
    applied_energy: "Applied energy materials, cool surfaces, combustion"
    space_thermal: "Spacecraft thermal control and thermo-optical properties"

institutions:

  # ─────────────────────────── TIER I — CORE ───────────────────────────

