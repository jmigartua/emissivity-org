    why_it_matters: |
      ISI Brno is a world-class niche center for cryogenic emissivity and
      absorptivity. Much emissivity work in the literature is concentrated at
      room or high temperature, but in cryogenics the radiative term can become
      decisive and reliable data are scarce. The Brno group has built a
      coherent research program around thermal radiative properties for
      cryogenics, including a database of low-temperature hemispherical
      emissivities and absorptivities. It is a clear example of how the
      emissivity community is structured: not by one dominant center, but by
      highly specialized laboratories that solve hard measurement problems in
      complementary temperature regimes.

