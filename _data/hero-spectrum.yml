# Source of truth for the landing-page hero figure.
# Rendered into _hero-spectrum.qmd by tools/generate_hero_figure.py (run in the
# Netlify build). Data are the measured values as served by EKHI, unmodified.

material: tungsten ribbon
property: normal spectral emissivity
temperature_k: 1600
geometry: "θ ≈ 0°"
reported_error_pct: 0.1

source:
  author: "J. C. de Vos"
  title: "A new determination of the emissivity of tungsten ribbon"
  journal: Physica
  volume: 20
  year: 1954
  pages: "690–712"
  doi: "10.1016/S0031-8914(54)80182-0"
