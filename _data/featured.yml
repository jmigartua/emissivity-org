# Featured announcement — rendered as the homepage band by
# tools/generate_featured.py (run it after editing, then quarto render).
# Set enabled: false to remove the band entirely.
#
# `variants` switch by date (show_from / show_until, inclusive, YYYY-MM-DD):
# the variant valid at build time is visible, and a small script switches
# between them in the browser, so no deploy is needed on the workshop days.

featured:
  enabled: true
  variants:

    - show_until: "2026-09-27"
      kicker: "Announcement · Community workshop"
      title: "IR-EMPOWER 2026"
      subtitle: "Infrared emissivity measurement workshop — 2nd edition"
      date_text: "28–29 September 2026"
      location: "Würzburg, Germany · hosted by CAE"
      countdown_to: "2026-09-28"
      body: >
        The programme is out: 21 talks over two days at the Center for Applied
        Energy Research, from national metrology institutes to university groups,
        with plenaries by EHU and LTeN-CNRS, a laboratory tour, two poster
        sessions, a round table on the future of the community and the Young
        Speaker Award. Founded in 2024 by the Thermomat / HAIRL group at EHU,
        IR-EMPOWER is the one meeting devoted entirely to emissivity measurement.
      links:
        - label: "Programme & speakers"
          url: "/ir-empower/2026/index.html"
        - label: "Official workshop page (CAE)"
          url: "https://cae-zerocarbon.de/IR-Empower-Workshop.html"
        - label: "IR-EMPOWER 2024 — first edition archive"
          url: "/ir-empower/2024/index.html"

    - show_from: "2026-09-28"
      show_until: "2026-09-29"
      kicker: "Happening now · Community workshop"
      title: "IR-EMPOWER 2026 is under way"
      subtitle: "Infrared emissivity measurement workshop — 2nd edition"
      date_text: "28–29 September 2026"
      location: "Würzburg, Germany · hosted by CAE"
      status: "live this week"
      body: >
        About forty researchers are meeting at the Center for Applied Energy
        Research in Würzburg for two days of talks, posters and a laboratory tour
        devoted to infrared emissivity measurement. The round table and the Young
        Speaker Award close the workshop on Tuesday afternoon.
      links:
        - label: "Today's programme"
          url: "/ir-empower/2026/index.html"
        - label: "Official workshop page (CAE)"
          url: "https://cae-zerocarbon.de/IR-Empower-Workshop.html"

    - show_from: "2026-09-30"
      show_until: "2026-10-13"
      kicker: "In review · Community workshop"
      title: "IR-EMPOWER 2026 in review"
      subtitle: "Second edition, Würzburg, 28–29 September 2026"
      date_text: "28–29 September 2026"
      location: "Würzburg, Germany · hosted by CAE"
      status: "archive"
      body: >
        Twenty-one talks, two poster sessions and a round table on how the
        community should grow: the second IR-EMPOWER is now part of the series
        archive, alongside the 2024 Bilbao edition.
      links:
        - label: "IR-EMPOWER 2026 archive"
          url: "/ir-empower/2026/index.html"
        - label: "The IR-EMPOWER series"
          url: "/ir-empower/index.html"
