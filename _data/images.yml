# emissivity.org — institution profile images
# Every entry license-verified (sweep of 2026-06-11). Rules: public domain,
# CC0/CC-BY/CC-BY-SA, or institutional release only. No stock, no AI imagery.
# `direct_url` is used by tools/fetch_images.sh; images land in
# assets/images/network/<id>.jpg and are only rendered once present.
