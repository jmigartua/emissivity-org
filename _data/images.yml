# Not yet sourced (no license-clean image found): dlr-psl (DLR's PSL chamber
# photo is CC BY-NC-ND — email DLR media for permission), cae-wuerzburg,
# stanford-fan, kaist-jang, vinca, tubitak-ume, thermomat-ehu (own photo!),
# and the remaining directory entries.

